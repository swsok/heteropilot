profile_id: a5000-24gb
vendor: NVIDIA
model: RTX-A5000
backend: cuda
memory_gb: 24
memory_bandwidth_gbps: 768

# Simulator `hardware` key. Must match a directory under profiler/perf/.
sim_hardware: A5000

# Per-field provenance, because a single top-level `source` cannot describe a
# profile whose numbers come from different places (absolute rule 3).
#   memory_gb             : measured  - nvidia-smi reports 24564 MiB
#   memory_bandwidth_gbps : vendor_spec - NVIDIA published figure, 384-bit GDDR6.
#                           Not measured; no bandwidth microbenchmark was run.
#   perf_data             : measured  - profiled locally on this machine,
#                           2026-08-07, vLLM 0.19.0, CUDA 12.8, sm_86.
source: measured

perf_data: profiler/perf/A5000/

# Measured 2026-08-14 on this machine's GPU 0 via nvidia-smi power.draw polling
# at 10 Hz (raw data: experiments/results/a5000_power/). Method:
#   active_power     = mean over 2,602 samples at util >= 90% during a real
#                      vLLM bench (300 sharegpt requests); p95 229.7 W, max
#                      230.0 W (= the board power cap)
#   standby_power    = mean of the first 2 s after the load ended (113.3 W)
#   standby_duration = elevated-draw window read off the decay curve (~2 s;
#                      140 W at +0 s, 24 W by +4 s)
#   idle_power       = post-run settled floor with the driver active (~19 W).
#                      Bare idle with no CUDA context measured 8.2 W; 19 W is
#                      the representative floor for a resident serving process.
# nvidia-smi reports board power internally averaged over ~1 s; treat the
# standby figures as first-order (deviations D7).
power:
  idle_power: 19.0
  standby_power: 113.3
  active_power: 227.6
  standby_duration: 2000000000   # ns (2 s)
  source: measured

supported_models:
  - pattern: "meta-llama/Llama-3.1-8B"
    dtypes: [bfloat16]

# Only TP=1 has been profiled so far; TP=2 was deferred (it is not needed for
# the Phase 0 sim-vs-real validation, which runs at TP=1). Raise this once
# profiler/perf/A5000/.../tp2/ exists.
max_tp_size: 1

notes: >
  Locally measured second hardware class, added to partially close deviations
  D4. Attention grid is at the x2 factor only (8,643 keys); the shipped
  RTXPRO6000 bundle is denser (19,364 keys), which costs about 2.2pp of
  end-to-end accuracy - see deviations D11.
