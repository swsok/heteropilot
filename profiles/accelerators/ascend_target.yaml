profile_id: ascend-target
vendor: Huawei
model: ASCEND_TARGET
backend: ascend
memory_gb: 64
memory_bandwidth_gbps: 1600

# Tier 0 synthetic bundle (tiered-profiles STEP 10, resolving deviations D4).
# The -t0 suffix is mandatory for synthetic labels (CONTRACT.md): the bundle
# under profiler/perf/ASCEND_TARGET-t0/ is generated by
# scripts/gen-tier0-bundles.sh from the datasheet below, never measured.
sim_hardware: ASCEND_TARGET-t0

# The YAML-level numbers are vendor-published figures, not measurements. The
# caveat below applies: Huawei publishes no official 910B datasheet, so these
# are secondary-source values. Promoted from `placeholder` because they now
# carry sources; they are still NOT measurements (absolute rule 3).
source: vendor_spec

perf_data: null

# Tier 0 datasheet. IMPORTANT provenance caveat: Huawei publishes no official
# English 910B datasheet. These figures are the consistently reported
# secondary-source values for the 910B2-class part (CSET "Pushing the
# Limits" 2024, https://cset.georgetown.edu/publication/pushing-the-limits-
# huaweis-ai-chip-tests-u-s-export-controls/ ; cross-checked against
# https://en.eeworld.com.cn/mp/XSY/a400532.jspx and
# https://mirrorfrog.com/en/docs/cards/huawei/ascend-910b/). Experiment E4
# (experiments/tier_validation/e4_sensitivity.py) sweeps every one of these
# +-30% precisely because this uncertainty exists.
datasheet:
  peak_tflops:
    bf16: 256.0   # secondary sources; FP16 commonly reported ~320
    fp16: 320.0
  memory_bandwidth_gbps: 1600  # 910B2/B3-class HBM figure, secondary sources
  # Efficiencies are NOT Ascend measurements: with zero target-hardware
  # access they are TRANSFERRED from this repo's A40 V3 fit
  # (profiles/accelerators/a40.efficiency.yaml, docs/tier0_calibration.md).
  # Cross-device transfer error is unquantified - KernelSight-LM reports up
  # to 3.8x attention-efficiency variance across devices - which is exactly
  # why any plan touching this island carries the analytical-tier caveat
  # and why E4 sensitivity-sweeps these values.
  flops_efficiency: 0.7468390409816932
  mem_efficiency: 0.5319523056625672
  family_efficiency:
    attention: 0.26187364905355237
    elementwise: 0.5319523056625672
    gather: 0.7961560162297642
    gemm: 0.7468390409816932
  datasheet_source: >
    Secondary sources for the Huawei Ascend 910B2-class part (no official
    Huawei datasheet exists): CSET 2024 "Pushing the Limits", eeworld.com.cn
    a400532, mirrorfrog.com 910B page. Efficiencies transferred from the A40
    V3 fit (a40.efficiency.yaml), NOT measured on Ascend.

# supported_models deliberately NOT extended (STEP 10): a support claim needs
# measured or vendor-documented evidence, and only Qwen3 has been asserted.
supported_models:
  - pattern: "Qwen/Qwen3-*"
    dtypes: [bfloat16]

max_tp_size: 8

notes: >
  Tier 0 target: no Ascend hardware is present and no measurement has been
  imported. The bundle behind sim_hardware is datasheet-derived
  (tier: analytical) via profiler.synth, so heterogeneous planning works end
  to end, but every plan that selects this island is reported simulator-only
  with the analytical-inputs caveat (planner/util/tier.py). Deviations D4 is
  resolved through this path; real measurements (Phase 3 CsvProfileImporter)
  still supersede it.
