profile_id: rtxpro6000-96gb
vendor: NVIDIA
model: RTXPRO6000
backend: cuda
memory_gb: 96
memory_bandwidth_gbps: 1597

sim_hardware: RTXPRO6000

#   memory_gb, memory_bandwidth_gbps : copied from upstream's bundled cluster
#     configs (configs/cluster/*.json). Upstream does not state how they were
#     obtained, so they are not claimed as measured here.
#   perf_data : measured by upstream, not by us. profiler/perf/RTXPRO6000/
#     meta.yaml records gpu="NVIDIA RTX PRO 6000 Blackwell Server Edition",
#     vLLM 0.19.0, CUDA 13.0, profiled 2026-04-24.
source: vendor_spec

perf_data: profiler/perf/RTXPRO6000/

power:
  # Copied verbatim from upstream configs/cluster/single_node_power_instance.json.
  # Upstream documents no derivation for these, so: placeholder, not measured.
  idle_power: 35
  standby_power: 300
  active_power: 600
  standby_duration: 18
  source: placeholder

supported_models:
  - pattern: "meta-llama/Llama-3.1-*"
    dtypes: [bfloat16]
  - pattern: "Qwen/Qwen3-32B"
    dtypes: [bfloat16]
  - pattern: "Qwen/Qwen3-30B-A3B-*"
    dtypes: [bfloat16]

max_tp_size: 2

# Tier 0 datasheet values (tiered-profiles STEP 8). Source: NVIDIA RTX
# Blackwell PRO GPU Architecture whitepaper v1.0, Appendix A Table 4,
# "RTX PRO 6000 Blackwell Workstation Edition" column.
# https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1.0.pdf
# Efficiencies are deliberately absent until fitted from the measured bundle
# (rtxpro6000.efficiency.yaml carries the fit; merging is a human decision).
datasheet:
  peak_tflops:
    bf16: 503.8  # Peak BF16 Tensor TFLOPS with FP32 accumulate, DENSE
                 # (1007.6 is the sparsity figure; footnote 2)
    fp16: 503.8  # Peak FP16 Tensor TFLOPS with FP32 accumulate, dense
  compute_units: 188      # SMs (Table 4)
  clock_mhz: 2617         # GPU boost clock (Table 4; peak rates use boost)
  l2_cache_mb: 128        # 131072 KB L2 (Table 4)
  # Vendor bandwidth (Table 4: 1792 GB/s). The profile-level 1597 above is
  # upstream's simulator figure; Tier 0 rooflines use the sourced vendor one.
  memory_bandwidth_gbps: 1792
  datasheet_source: >
    NVIDIA RTX Blackwell PRO GPU Architecture whitepaper v1.0, Appendix A
    Table 4 (RTX PRO 6000 Blackwell Workstation Edition):
    https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1.0.pdf.
    BF16/FP16 dense = with-FP32-accumulate non-sparsity figures.

notes: >
  The only hardware class shipped by upstream. Profiled on CUDA 13.0 /
  Blackwell, whereas our A5000 bundle is CUDA 12.8 / Ampere - when comparing
  the two, toolchain differs alongside hardware.
