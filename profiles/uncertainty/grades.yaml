# Source grades -> error ranges (WORK_ORDER_uncertainty_planner.md §2.2).
#
# Every number in this file has a source. `planner/uncertainty/grades.py`
# rejects the table if a row carries a number without a `source`, so the rule is
# enforced rather than trusted. No number from this file is hardcoded in code;
# only the formulas are.
#
# A (kind, grade) that is absent from `rules:`, or present with
# `rule: unbounded`, sources NO WIDTH OF ITS OWN. Since the domain-scoping work
# order S2 (deviations D111) that is no longer the end of the road: it falls
# through to the grade's row in `defaults:` at the foot of this file, and only a
# grade with no default row is unbounded - "cannot be decided before measuring".
# A default is a stated policy with a cited basis, and every range built from
# one is labelled `range_source: default` wherever it is shown, so it is never
# read as this input's own measurement.
#
# Rules:
#   unbounded            no sourced width of its own; falls through to `defaults:`
#   symmetric_fraction   [nominal*(1-value), nominal*(1+value)]
#   ratio_floor          [nominal*r_min, nominal]  (a spec is an upper bound)
#   calibration_derived  width comes from the calibration store, not this file
#
# ---------------------------------------------------------------------------
# INVESTIGATION RESULT (work order §0.4) - what the work order asked for and
# what the repository actually holds. THREE of the four "조사 필요" rows could
# not be filled as specified, and the fourth is filled from a different file
# than the one named:
#
#  1. `calibration_report.operator_error_p95` DOES NOT EXIST, and neither does
#     any p95 of RELATIVE error anywhere in this repository. The strings
#     `operator_error` and `calibration_report` occur only in the work order
#     itself, and profiler/synth/calibrate.py's `ScalingTable.to_dict` persists
#     no error field at all (scalars / piecewise / n_anchors /
#     anchors_per_family / derived_from). The one genuine p95 in the code is
#     `p95_abs_error_us` (profiler/synth/diff.py:88, computed :196, serialized
#     :128): absolute MICROSECONDS, unusable as a ±fraction, and held by no
#     committed artifact.
#     Nor are E1/E2 the experiments the work order assumes: E1
#     (`e1_plan_agreement.py`) measures PLAN AGREEMENT - top-1/top-3 match,
#     rel.err, Kendall tau - and carries no operator-error field at all; E2
#     (`e2_budget_pareto.py`) is a measurement-BUDGET Pareto study. The two
#     `profile` rows below take E2's committed MAPE figures and label them for
#     what they are: MEANS, operator-level, A40-only.
#  2. `power`/`vendor_spec` was specified as the TDP-vs-measured error p95 from
#     outputs/phase0_power_repro.csv. THAT FILE HOLDS NO POWER DATA - it is a
#     per-request latency CSV (12 columns: instance id, request id, model,
#     input, output, arrival, end_time, latency, queuing_delay, TTFT, TPOT,
#     ITL; 10 data rows). This is deviation D2, power is stdout-only. See the
#     row for why the prose TDPs cannot substitute.
#  3. `link_bw`/`vendor_spec` needed r_min = the minimum measured/spec ratio in
#     the repository. NO SUCH RATIO CAN BE FORMED: not one link here has both a
#     benchmarked throughput and a repo-recorded spec OF THE SAME QUANTITY.
#     Honest answer: unbounded. The row records why the tempting pairing is a
#     category error - it was made in the first draft of this file and is
#     retracted here.
#  4. `sim_error`/`measured` is the one row that is exactly what the work order
#     says it is: profiles/calibration/*.yaml carry per-hardware, per-bucket
#     p95 as fractions. Note these are END-TO-END TTFT/TPOT sim-vs-real errors,
#     a different quantity from the operator-level `profile` rows, and cannot
#     substitute for them.
# ---------------------------------------------------------------------------

rules:
  # --- sim_error -----------------------------------------------------------
  - kind: sim_error
    grade: measured
    rule: calibration_derived
    unit: fraction
    source: >
      profiles/calibration/*.yaml, hardware.<label>.errors.<bucket>.{ttft,tpot}
      .p95_abs_error (fractions), with mean_error and worst_error alongside.
    note: >
      Width is the bucket's (p95_abs_error - |mean_error|) either side of the
      interpolated error, read from the calibration store at build time rather
      than from this table (§2.2). A bucket whose p95 equals its |mean| yields
      no width and is recorded unbounded. This is end-to-end TTFT/TPOT error,
      not operator-level.

  # --- profile -------------------------------------------------------------
  - kind: profile
    grade: analytical
    rule: symmetric_fraction
    value: 0.38875811006420014
    unit: fraction
    source: >
      outputs/tier_validation/e2/e2_budget_pareto.json, conditions[] entry
      "A_tier0", key `mape_vs_tier2` (0 measured points, 10091 hold-out rows).
      Fraction, so 0.3888 = 38.9 %.
    note: >
      THREE things this is not. (a) NOT a p95 - MAPE is the MEAN of
      |synth-measured|/measured (profiler/synth/diff.py:196), so it understates
      the tail, and docs/tier0_calibration.md records that the spread is wide
      even where the median ratio is pinned at 1.0. (b) NOT end-to-end - it is
      a per-OPERATOR timing error. End-to-end latency sums many operators whose
      errors partially cancel, so using it as a multiplier on TTFT / TPOT
      OVERSTATES the range; that is the conservative direction for a robustness
      margin, but it must not be read as a measured end-to-end bound. For the
      end-to-end cost of this error on the planner's own objective, E1's
      rel.err for the tier0+sim leg was 0.4 % (llama31-8b) and 11.3 %
      (llama31-8b-light). (c) NOT per-hardware - E2 is hardcoded to A40 /
      Llama-3.1-8B bf16 TP=1 (experiments/tier_validation/e2_budget_pareto.py
      :44-46) and this row is applied to every hardware label. The only
      per-hardware split that exists (docs/tier0_calibration.md "Residual error
      of the adopted V3": A40 38.9 %, RTXPRO6000 33.0 %) is SELF-FIT, train ==
      test, and therefore optimistic - the doc says so - and its RTXPRO6000
      column carries an unclamped bound violation (elementwise efficiency
      1.007). It is deliberately not used here.

  - kind: profile
    grade: calibrated
    rule: symmetric_fraction
    value: 0.2950592981449794
    unit: fraction
    source: >
      outputs/tier_validation/e2/e2_budget_pareto.json, conditions[] entry
      "B_attention_anchors", key `mape_vs_tier2` (200 anchors, all attention;
      9891 hold-out rows). Fraction, so 0.2951 = 29.5 %.
    note: >
      Same three caveats as profile/analytical - mean not p95, operator-level
      not end-to-end, A40-only. Condition B is the representative one because
      attention-focused anchoring is what `python -m profiler.synth calibrate`
      implements. Its sibling condition "C_uniform_anchors" reached 0.4288, i.e.
      A BADLY ANCHORED TIER 1 IS WORSE THAN TIER 0 (0.3888); raise this row to
      0.4288 for a bundle known to have been anchored uniformly. A second Tier 1
      source exists in docs/tier0_calibration.md ("Tier 1 hold-out curve":
      33.1 / 30.4 / 29.7 / 27.8 / 27.3 % at 1/2/5/10/20 % anchor share, A40
      only) but has NO committed artifact behind it, so the artifact is
      preferred here for §7's evidence mapping.

  - kind: profile
    grade: vendor_spec
    rule: unbounded
    unit: fraction
    note: >
      No row in the work order's §2.2 table, and no sourced width exists. Real
      and reached in practice: profiles/accelerators/rtxpro6000.yaml declares
      `source: vendor_spec` (its memory_gb / memory_bandwidth_gbps are copied
      from upstream's cluster configs with no stated derivation) while its perf
      bundle is measured, so the weaker-of-two-signals rule grades it
      vendor_spec. Listed explicitly rather than left to the absent-row
      fallback so the gap is documented, not silent.

  - kind: profile
    grade: placeholder
    rule: unbounded
    unit: fraction
    note: >
      No bundle, or the profile YAML itself is a placeholder. Includes the
      proxy case the registry exists to catch: ascend-sim-proxy borrows the
      measured RTXPRO6000 bundle while standing an NPU in for a GPU, so its
      error against a real NPU is not merely large, it is unknown.

  - kind: profile
    grade: user_defined
    rule: unbounded
    unit: fraction
    note: A deliberate what-if value. Unbounded unless the user supplies a range.

  # --- link_bw -------------------------------------------------------------
  - kind: link_bw
    grade: vendor_spec
    rule: unbounded
    unit: gbps
    note: >
      RETRACTED r_min. An earlier draft of this file set r_min = 25.71 / 32.0 =
      0.803 and called it the one like-for-like pair in the repo. IT IS NOT
      LIKE-FOR-LIKE and the row is now unbounded. The numerator, 25.71 GB/s, is
      a HOST<->DEVICE sustained pinned D2H measurement
      (outputs/a40_profile/host_bandwidth.json, sustained[] where streams=1 and
      host_memory=pinned, field d2h_aggregate_gbps). The denominator, 64.0 GB/s
      `source: vendor_spec`, is attached to a GPU<->GPU host-bridge link
      (experiments/configs/clusters/exp1-a40-tp-sweep.yaml:86-93, id
      pcie-node0-gpu0-gpu2) whose own comment at :84 reads verbatim "NOT a
      measured p2p bandwidth; it is the standard link rate". Dividing one by the
      other crosses two different links AND a bidirectional spec by a
      unidirectional measurement; halving 64.0 fixes only the second defect.
      No per-direction PCIe spec is written down anywhere in the repo - the only
      statements are qualitative ("Pinned saturates at ~25.77 GB/s, which is
      PCIe 4.0 x16 line rate", experiments/results/gpu_host_bandwidth.md:53).
      The RNGD side cannot supply a ratio either: host<->PE is measured at
      26.27 GB/s across 8 streams (outputs/rngd_profile/parallel_bandwidth.json)
      but no PCIe generation or host-interface bandwidth is recorded for the
      card anywhere - not in docs/nodes/npu.md, not in the datasheet_source of
      profiles/accelerators/furiosa_rngd_card.yaml.
      TO CLOSE THIS ROW: write a per-direction PCIe spec into a repo file with a
      citation and set r_min = 25.71 / that value, or measure a p2p bandwidth
      (no p2p/NCCL measurement exists today).

  - kind: link_bw
    grade: placeholder
    rule: unbounded
    unit: gbps

  - kind: link_bw
    grade: user_defined
    rule: unbounded
    unit: gbps
    note: A deliberate what-if value. Unbounded unless the user supplies a range.

  # --- link_lat ------------------------------------------------------------
  - kind: link_lat
    grade: vendor_spec
    rule: unbounded
    unit: ns
    note: >
      No link latency in this repository is measured, so no measured/spec ratio
      exists for latency and none can be borrowed from bandwidth.
      experiments/configs/clusters/a40x8.yaml states the position outright: its
      NVLink bandwidth is measured while "latency_ns: placeholder - NVLink
      latency was not measured; 1000 ns is a representative value". The Link
      schema carries ONE `source` field for both quantities, so a link graded
      measured credits its latency as measured too - the registry inherits that
      overstatement and cannot correct it without a schema change.

  - kind: link_lat
    grade: placeholder
    rule: unbounded
    unit: ns

  - kind: link_lat
    grade: user_defined
    rule: unbounded
    unit: ns

  # --- power ---------------------------------------------------------------
  - kind: power
    grade: vendor_spec
    rule: unbounded
    unit: fraction
    note: >
      Unbounded for four independent reasons, any one of which is sufficient.
      (a) The file the work order cites, outputs/phase0_power_repro.csv, has no
      power column at all - it is a per-request latency CSV (deviation D2).
      (b) No accelerator profile populates `tdp_w`: the field is declared at
      planner/inventory.py:318 and read at planner/optimizer/greedy.py:48, but
      no YAML in the repo sets it, so it is always None (deviation D7 records
      why the schema went this way). TDP survives only in prose comments.
      (c) n = 3 hardware labels carry a TDP in prose - a p95 over three points
      is not a statistic.
      (d) Those three do not admit a common range. A40 300 W stated vs 297.83 W
      measured (+0.73 %) and A5000 230 W vs 227.6 W (+1.05 %) would suggest
      about ±1 %, but RNGD-CARD draws 290.93 W against its stated 180 W
      (profiles/accelerators/furiosa_rngd_card.yaml:133 vs :178) - 1.62x TDP,
      -38 % error, which a ±1 % range fitted on the two NVIDIA parts misses by
      a factor of 38. If this row is ever closed it must be closed PER
      HARDWARE; a single global power range is not defensible.
      NOT USED, and why: 10 Hz nvidia-smi power.draw logs do exist
      (experiments/results/{a40,a5000}_power/load_gpu*.csv) and a per-sample
      |sample - TDP| / TDP p95 can be computed from them (A40 3.64 %, A5000
      2.70 % over util >= 90 %). That measures within-run sample variance around
      a TDP that happens to be right on two GPUs; it is not the error of TDP as
      a power model, and it excludes the RNGD case, which is the one that
      matters.

  - kind: power
    grade: placeholder
    rule: unbounded
    unit: fraction
    note: >
      Reached by every profile whose power block is copied verbatim from
      upstream's single_node_power_instance.json (rtxpro6000, ascend-sim-proxy):
      upstream documents no derivation for those watt figures.

  - kind: power
    grade: user_defined
    rule: unbounded
    unit: fraction

# ---------------------------------------------------------------------------
# DEFAULT RANGES BY GRADE (domain-scoping work order S2; deviations D111)
#
# The rows above say what a (kind, grade)'s width IS. These say what it is
# ASSUMED to be when the row above sources no width - which, before S2, sent the
# item out of the measurement plan's ranking entirely and into "cannot be
# decided before measuring". V3 is why that path had to go: `link_bw:
# pcie-a40a-02` was a `vendor_spec` with no sourced range, so it was undecidable
# and unranked, while it was in fact the input that explained the whole of a
# -43.4 % TPOT error and cost 0.114 h to measure.
#
# WHAT A DEFAULT IS, AND IS NOT. It is a stated policy with a cited basis, and
# it is labelled `range_source: default` from the registry through to the
# rendered plan, so it is never read as this input's own measurement. It is NOT
# a measurement of this input, and it is NOT a claim that the true value lies in
# the interval - it is the interval the planner will search when nothing better
# exists. A grade with no defensible default has NO ROW here, and stays
# undecidable; `user_defined` is that case, deliberately (a what-if is the
# user's number, not a population).
#
# The magnitudes are settings. S2's purpose is to remove the "no range -> no
# rank" path, not to justify these values; each is sourced to the widest
# relevant observation the repository actually holds, and tightening one is a
# later job that needs measurements, not an argument.
#
# `rule: relative` multiplies the nominal (a bandwidth, a latency, a profile or
# power multiplier). `rule: absolute` adds either side of it, for `sim_error`,
# whose nominal is an error fraction that may be zero or negative and on which a
# multiplicative width would be meaningless.
# ---------------------------------------------------------------------------

defaults:
  - grade: vendor_spec
    rule: relative
    lo: 0.125
    hi: 1.0
    source: >
      experiments/p2_evidence/results/v3_verdict_accuracy.md A.1 and A.4:
      the TP=4 all-reduce effective bus bandwidth over the A40 node's PCIe path
      measured 8.8 GB/s against the 64.0 GB/s `source: vendor_spec` written on
      the same link (ratio 0.1375), reproduced on a second GPU group
      (outputs/p2_evidence/link/tp4.json, link47/tp4.json).
    note: >
      n = 1 link, on one node, for one collective. Rounded DOWN to 1/8 rather
      than fitted, and the upper end is the spec itself because a vendor
      bandwidth is an upper bound: no deployment exceeded its spec here, and the
      D2/D7 history is of specs being optimistic rather than conservative. Read
      as "a spec bandwidth may be worth as little as an eighth of itself in
      deployment", which is what was measured, not as a distribution.

  - grade: vendor_spec
    kind: link_lat
    rule: relative
    lo: 1.0
    hi: 8.0
    source: >
      The same A.1 measurement, read in the direction latency runs: a link that
      delivers 1/8 of its spec bandwidth moves a message of a given size in 8x
      the spec-implied time.
    note: >
      The grade-level vendor_spec default is the WRONG SHAPE for latency and
      would have claimed reality sits between an eighth of the spec and the spec
      - i.e. faster than the datasheet. A spec latency is a LOWER bound. No link
      latency in this repository is measured (see the link_lat/vendor_spec row
      above), so this row transports a bandwidth observation onto a latency
      axis; it is the weakest default here and is marked as such wherever an
      item cites it.

  - grade: analytical
    rule: relative
    lo: 0.6112418899357999
    hi: 1.3887581100642001
    source: >
      outputs/tier_validation/e2/e2_budget_pareto.json, condition A_tier0,
      mape_vs_tier2 = 0.38875811006420014 over 10,091 hold-out rows with 0
      measured points. The same number the profile/analytical row above uses.
    note: >
      Generalises that row to the kinds that have no row of their own. It
      carries the same three caveats: a MEAN not a p95, per-OPERATOR not
      end-to-end, and A40 / Llama-3.1-8B bf16 TP=1 only.

  - grade: calibrated
    rule: relative
    lo: 0.7049407018550206
    hi: 1.2950592981449794
    source: >
      outputs/tier_validation/e2/e2_budget_pareto.json, condition
      B_attention_anchors, mape_vs_tier2 = 0.2950592981449794 (200 anchors,
      9,891 hold-out rows). The same number the profile/calibrated row uses.
    note: Same caveats as the analytical default.

  - grade: placeholder
    rule: relative
    lo: 0.5711773330349045
    hi: 1.4288226669650955
    source: >
      outputs/tier_validation/e2/e2_budget_pareto.json, condition
      C_uniform_anchors, mape_vs_tier2 = 0.4288226669650955 - the WORST of the
      four conditions, and the one docs/tier0_calibration.md reads as "a badly
      anchored Tier 1 is worse than Tier 0".
    note: >
      A placeholder is a number nobody stands behind, so the widest grounded
      error the repository has measured is the floor of what it could be wrong
      by, not an estimate of it. This default is certainly too NARROW for the
      proxy case the registry exists to catch (ascend-sim-proxy borrows a
      measured GPU bundle for an NPU); it buys that item a rank in the queue,
      which is the point, and the item's own note still says the error is
      unknown.

  - grade: unknown
    rule: relative
    lo: 0.5711773330349045
    hi: 1.4288226669650955
    source: >
      Same as the placeholder default (E2 C_uniform_anchors, 0.4288226669650955).
    note: >
      `unknown`, `placeholder` and `user_defined` share rank 0 in the grade
      scale, but not a default: the first two are "nobody measured this", which
      this row prices, while the third is a deliberate what-if whose range is
      the user's to state.

  - grade: measured
    kind: sim_error
    rule: absolute
    half_width: 0.02
    source: >
      Repeat spread of a re-measurement, bounded by the two repeats this
      repository holds: PR #104 re-ran the A40 accuracy ladder with explicit
      NUMA binding and reproduced its three points to 0.42 % / 0.37 % / 0.46 %,
      and D94 re-ran the RNGD bucket1024 grid bound and reproduced it to
      <= 0.24 %.
    note: >
      2 % is ~4x the worse of those two, deliberately: both repeats were of a
      quiet lab with one workload, and the quantity this widens is an END-TO-END
      error fraction, not the device cycles D94 measured. Reached only when a
      calibration bucket's p95_abs_error equals its |mean_error|, i.e. when the
      store records a spread of exactly zero - which is a sample-count artifact,
      not a perfect simulator.

  - grade: placeholder
    kind: sim_error
    rule: absolute
    half_width: 0.446
    source: >
      experiments/p2_evidence/results/v3_verdict_accuracy.md §6.3: the largest
      end-to-end simulator error measured against hardware in this repository,
      -44.63 % on p99 TPOT (predicted 36.547 ms, delivered 66.012 ms), A40
      TP=4 open-loop.
    note: >
      The item this reaches is `sim_error:<hw>/unfitted` - hardware whose
      simulator error has NEVER been measured, nominal 0.0. A relative width
      would be zero there, which is the one answer that is certainly wrong. So
      the width is absolute and is the worst error the repository has actually
      seen; n = 1, and a hardware nobody has calibrated can of course be worse.

  - grade: unknown
    kind: sim_error
    rule: absolute
    half_width: 0.446
    source: Same as the sim_error/placeholder default (v3_verdict_accuracy.md §6.3).
    note: Kept in step with the grade-level unknown/placeholder pairing above.
