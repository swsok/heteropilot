notes: 'WHAT IS MEASURED AND WHAT IS INHERITED - the one thing to read before using
  this bundle. (1) MEASURED: absolute per-decoder-layer latency, per token bucket,
  on the real graph; decode and prefill attention; the head. (2) INHERITED, NOT MEASURED:
  the split of a decoder layer''s stage time across the canonical layer names (layernorm
  / qkv_proj / rotary_emb / o_proj / gate_up_proj / act_fn / down_proj). The compiler
  fuses a whole decoder layer into ONE stage and does not expose the pieces, so the
  magnitude comes from the vendor and the distribution is taken from the per-PE harness
  bundle''s shares at the same token count, rescaled to sum to the vendor figure.
  The simulator only ever SUMS the per-layer lookups for an iteration, so the sum
  is what has to be right - but no single row here is a vendor measurement of that
  named layer. The vendor/harness ratio is 1.16x to 1.65x depending on bucket and
  is recorded per bucket in outputs/rngd_edf_bundle/edf_vs_harness_dense.csv. (3)
  The tokens=1 row comes from the fused Composed graph, corrected three ways: its
  9 segment times overlap (device cycles are 114.7% of wall at concurrency 1), so
  they are scaled so their sum equals the measured wall-clock forward; the terminal
  segment is moved to per_sequence.csv because it is the head, not a layer; and the
  measured batch-1 attention is subtracted so the simulator''s separate attention
  charge is not counted twice. (4) DECODE ATTENTION IS CALIBRATED TO THIS TRAFFIC
  MIX. The runtime groups a decode batch by kv bucket, so per-layer attention depends
  on the batch''s kv DIVERSITY (1.95 executions per layer at batch 2, 3.08 at batch
  29), which the 4D contract cannot express. Each concurrency therefore contributes
  one row whose time is total decode-attention device time over (forwards x 32), which
  makes the total close but ties the decode attention axis to sharegpt-like traffic
  at mean kv ~2200. (5) per_sequence.csv takes its magnitude at 1 sequence from the
  vendor''s terminal segment and its SHAPE over sequence count from the harness, which
  is the only source for how the head scales with batch. (6) MIXED prefill+decode
  steps are not in the traces at all: every attention bucket is pure prefill or pure
  decode, so the 4D grid has data only on the two axis planes and the simulator''s
  nearest-slice fallback approximates the interior, which under-counts continuous-batching
  steps that do both. (7) No skew.csv / skew_fit.csv, so ragged decode batches fall
  back to the uniform-mean attention path. SELF-CONSISTENCY, the check that this bundle
  passes and the synthetic one could not: predicted wall time from this bundle against
  measured wall time over a 32x concurrency range is +0.0% / +0.1% / +0.5% / -4.7%
  / -5.2% / +0.2% at concurrency 1 / 2 / 4 / 8 / 16 / 32. CARD-LEVEL MAPPING, and
  why it is legitimate HERE where it was not before. One accelerator is one whole
  RNGD card running at the vendor''s default -tp 8, so the card is a tp1 instance
  and the simulator adds no collective for it. With the per-PE harness bundle that
  was a fatal omission - the intra-card all-reduce was simply missing, and decode
  came out 45.5% fast. Here it is correct BY CONSTRUCTION: an EDF stage time is what
  the card took to execute that stage, reduction included, so the measurement has
  already paid for the communication and charging it again would double-count. The
  granularity also now matches the hardware: the artifact''s tensor_parallel_size
  8 is realised as TWO FUSED 4-PE QUADS (leader_device is npu0pe0-3, and the serve
  log confirms DpId(0) -> [npu0pe0-3, npu0pe4-7]), not eight ranks, so a per-PE tp8
  bundle modelled a rank granularity that does not exist. EDF reports only one leader
  device, and the two quads run concurrently, so these times are one card''s. max_tp_size
  stays 1: TP ACROSS cards has never been built or served here.'
