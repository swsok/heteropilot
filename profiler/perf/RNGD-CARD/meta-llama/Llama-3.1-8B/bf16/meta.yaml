measurement_method: 'FuriosaAI''s own EDF profiler on the real served graph, NOT a
  layerwise harness. `furiosa-llm serve` was run on the vendor''s prebuilt furiosa-ai/Llama-3.1-8B-Instruct
  artifact (tensor_parallel_size 8) with EDF_PROFILER_OUTPUT_PATH / TUC_PROFILE_LEVEL=info
  / RUST_LOG=span::tuc=info, and driven with 24 sharegpt requests at each of six concurrencies
  (1, 2, 4, 8, 16, 32) - 1.74 M stage executions in total. The trace is CSV (leader_device,
  name, cycle); cycles are converted at 1.6 GHz, derived as total device cycles over
  wall time on a saturated card (1,599.9 MHz, 0.006% off a round figure). Each row
  is one compiler-emitted stage execution named by its compiled bucket, so these are
  the times the vendor''s own kernels take on the vendor''s own graph, WITH THE INTRA-CARD
  REDUCTION ALREADY INSIDE THEM - which is the whole point of the card-as-device mapping
  below. The runtime has TWO compiled plans and both are captured: a fully-fused `Composed`
  graph for batch-1 decode (9 segments partitioning the stack, each executing once
  per forward) and a per-layer `Tokenwise` + `Attention` plan for batch >= 2 (exactly
  32 Tokenwise executions per forward, one per decoder layer). There is no `input_size:
  1` Tokenwise bucket anywhere in the traces because at batch 1 the bucketed path
  is not used at all.'
