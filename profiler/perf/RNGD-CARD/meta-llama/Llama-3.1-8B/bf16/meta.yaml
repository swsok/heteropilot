notes: 'IMPORTANT provenance caveat: these are real measurements on real RNGD silicon,
  but of layer implementations written for this harness (experiments/scripts/profile_rngd.py),
  NOT of vLLM''s fused kernels the way the A40 / A5000 / RTXPRO6000 bundles were measured.
  A GPU-vs-RNGD comparison built on this bundle compares the same mathematics executed
  by different software stacks, and must say so. Coverage gaps, all deliberate and
  none silent: skew.csv / skew_fit.csv are absent, so the simulator falls back to
  uniform-batch attention and under-represents ragged decode batches; dense.csv is
  missing act_fn@1 token and rotary_emb@2048 because the compiler keeps those two
  shapes on the CPU reproducibly (retried, same result), and the simulator clamps
  below a layer''s lowest key; attention.csv is missing exactly one shot, n_decode=256
  x kv_decode=8192, whose K+V is 8.6 GB against the 6.25 GB a single PE can address
  -- a real device limit, not a harness cap. A rank here is one PE, not one card:
  furiosa-llm build -tp counts PEs per TP group and defaults to 8, so a full card
  is a TP-8 group. CARD-LEVEL MAPPING: this bundle''s tp1/ IS the measured tp8/ of
  the per-PE bundle, because one accelerator here is one whole RNGD CARD running at
  the vendor''s default -tp 8. The 8 PEs each execute 1/8 of every layer in parallel,
  so the card''s per-layer LATENCY equals one PE''s sharded latency - which is exactly
  what tp8/ measured. Why model it this way: TP=8 is the only configuration that both
  uses all 8 PEs and keeps the weights sharded once (1.87 GiB/PE), so it holds 246,079
  KV tokens against 123,550 for tp4xdp2 on the same silicon, and tp2xdp4 does not
  fit at all. It is also the only deployable configuration: furiosa-llm build -tp
  defaults to 8 and the vendor''s prebuilt artifact is tensor_parallel_size 8. THE
  COST, stated plainly: a tp1 instance has no TP group, so the simulator adds NO collective
  for the intra-card all-reduce after o_proj and down_proj. That communication is
  real and is NOT in these numbers; it is absorbed into whatever gap remains against
  the real furiosa-llm benchmark, and that gap is the honest bound on it. INPUT QUALITY:
  tp8 is the sparsest measured grid - 81/13/27 rows against 107/18/35 at tp4 - because
  sharding the dims by 8 (intermediate 1792, 4 heads, 1 KV head) makes shapes small
  enough that the compiler stops using the tensor unit. Every layer still holds 8-10
  of 12 token points, so interpolation works, but this bundle is coarser than the
  per-PE tp4 one.'
