measurement_method: 'Layerwise on-device measurement via furiosa.torch, not vLLM (RNGD
  has no vLLM platform plugin). Each canonical layer of profiler/models/llama.yaml
  is compiled on its own through torch.compile(backend=furiosa.torch.backend) inside
  furiosa.torch.config.profiler_context(RNGDProfiler()), which records device spans
  (Renegade::TuExec and DMA). time_us is the UNION of those spans -- wall time the
  device was busy -- because the tensor units run concurrently and DMA overlaps compute,
  so summing them overcounts (measured on down_proj@256: TuExec sum 1603 us + DMA
  sum 964 us, but union 1250 us, equal to the full span of the timeline). TP=N is
  measured on a single PE with intermediate_size / num_attention_heads / num_key_value_heads
  / vocab_size divided by N, mirroring profiler/core/engine.py, so the shapes are
  one rank''s; collectives are left to ASTRA-Sim.'
