notes: 'IMPORTANT provenance caveat: these are real measurements on real RNGD silicon,
  but of layer implementations written for this harness (experiments/scripts/profile_rngd.py),
  NOT of vLLM''s fused kernels the way the A40 / A5000 / RTXPRO6000 bundles were measured.
  A GPU-vs-RNGD comparison built on this bundle compares the same mathematics executed
  by different software stacks, and must say so. Coverage gaps, all deliberate and
  none silent: skew.csv / skew_fit.csv are absent, so the simulator falls back to
  uniform-batch attention and under-represents ragged decode batches; dense.csv is
  missing act_fn@1 token and rotary_emb@2048 because the compiler keeps those two
  shapes on the CPU reproducibly (retried, same result), and the simulator clamps
  below a layer''s lowest key; attention.csv is missing exactly one shot, n_decode=256
  x kv_decode=8192, whose K+V is 8.6 GB against the 6.25 GB a single PE can address
  -- a real device limit, not a harness cap. A rank here is one PE, not one card:
  furiosa-llm build -tp counts PEs per TP group and defaults to 8, so a full card
  is a TP-8 group.'
