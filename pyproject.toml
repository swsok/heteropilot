# Tooling config for the HeteroPilot planner only.
#
# Deliberately has no [project] table: this is not a package definition, and
# upstream LLMServingSim ships no pyproject.toml. Adding one here must not
# change how upstream code is built or linted.
#
# Work order §9 sets the CI gate as pytest + ruff + mypy, with mypy scoped to
# planner/. Upstream `serving/` is not type-clean and is not ours to fix before
# Phase 5.

[tool.ruff]
line-length = 100
target-version = "py310"
# profiler/ is excluded per-subpackage (not wholesale) so that the fork-owned
# profiler/synth/ package and profiler/core/contract.py are actually linted
# (WORK_ORDER_tiered_profiles.md STEP 0). Upstream profiler code stays excluded.
extend-exclude = [
    "astra-sim",
    "serving",
    "profiler/core",
    "profiler/v0",
    "profiler/models",
    "profiler/power",
    "profiler/perf",
    "profiler/__init__.py",
    "profiler/__main__.py",
    "bench",
    "workloads",
    "scripts",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The fixtures are simulator progress lines copied verbatim from the D23 evidence
# and from a run that completed. Re-wrapping them to 100 columns would make them
# something other than what the watcher actually parses, which is the whole point
# of using real output rather than invented output.
"tests/test_livelock_watch.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["planner", "profiler/synth", "profiler/contract.py"]
ignore_missing_imports = true
warn_unused_ignores = true
# serving/ is upstream and not type-clean; check that our calls into it are
# well-formed without inheriting its errors.
follow_imports = "silent"

[[tool.mypy.overrides]]
# Narrowed from "profiler.*" so profiler.synth (fork-owned, STEP 0) is checked
# while upstream profiler subpackages keep their blanket exemption.
module = ["serving.*", "profiler.core.*", "profiler.v0.*", "bench.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
