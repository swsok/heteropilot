# Tooling config for the HeteroPilot planner only.
#
# Deliberately has no [project] table: this is not a package definition, and
# upstream LLMServingSim ships no pyproject.toml. Adding one here must not
# change how upstream code is built or linted.
#
# Work order §9 sets the CI gate as pytest + ruff + mypy, with mypy scoped to
# planner/. Upstream `serving/` is not type-clean and is not ours to fix before
# Phase 5.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["astra-sim", "serving", "profiler", "bench", "workloads", "scripts", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends/Query in defaults is the API,
# not a mutable-default bug (scenariolab/api/server.py).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.10"
files = ["planner", "scenariolab"]
ignore_missing_imports = true
warn_unused_ignores = true
# serving/ is upstream and not type-clean; check that our calls into it are
# well-formed without inheriting its errors.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["serving.*", "profiler.*", "bench.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
