caveats:
- 'Prefix caching is disabled for every candidate. With it enabled the simulator''s
  prefix-cache memory grows monotonically and the run dies on any device small enough
  to saturate (docs/deviations.md D12). Consequence: ServiceSpec.traffic.prefix_share_ratio
  has no effect on these predictions, and TTFT is pessimistic for workloads with genuinely
  shared prefixes.'
- P/D KV-transfer cost is a planner-side analytical add-on; the simulator models the
  prefill->decode handoff as free (docs/phase5_plan.md increment 2). Reported TTFT
  and energy for pd_split plans include it. TTFT offsets are per-percentile (p99 uses
  the p99 prompt length, etc.); the energy offset is a p50/median approximation of
  the mean, so it is slightly low on skewed prompt distributions. TPOT is unchanged
  (the transfer is one-time, pre-decode) and transfer power is not modeled. Bandwidth/path/prompt
  assumptions are recorded in provenance['pd_transfer'].
