# COPY of pd-rngd-gpu-card.yaml with the cross-pair PCIe links set to the
# MEASURED TP=4 effective all-reduce bandwidth instead of the vendor_spec 64.0.
# A3: the committed fixture is NOT edited -- E-A1 and every result replayed from
# it keep their cluster unchanged.
#
# `pcie-a40a-02` and `pcie-a40b-02`: 64.0 vendor_spec -> **8.8 measured**.
#
# Measured 2026-09-17 with torch + NCCL 2.27.5 over the four GPUs of one island,
# 64 MiB all-reduce: 8.81 GB/s busbw on CUDA 0-3 and 8.78 on CUDA 4-7, agreeing
# to 0.5 % across two independent NUMA groups. That is the bandwidth the TP group
# actually gets, which is what this link stands for in the simulator.
#
# Two other defensible values are recorded beside it in
# experiments/p2_evidence/results/v3_verdict_accuracy.md appendix A, and they
# BRACKET this one rather than compete with it:
#   25.0 GB/s  a direct device-to-device copy across the same path -- the link
#              with no collective algorithm on top of it
#   7.5-8.4    what V4's perturbation had to assume to reproduce the measurement
#
# The NVLink links are left at 112.5 although the same probe measured 52.2 GB/s
# p2p and 39.1 busbw on that path. Changing them was not asked for and is not
# needed for this candidate: TP=4's ring is limited by the slowest hop, which is
# this one.
cluster_id: pd-rngd-gpu-card-measured-pcie
