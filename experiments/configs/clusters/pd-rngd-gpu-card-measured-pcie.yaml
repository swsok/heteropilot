    backend: furiosa
    memory_gb: 47.5
    state: FREE
    profile: profiles/accelerators/furiosa_rngd_card.yaml
  nics:
  - id: nic0
    type: ethernet
    speed_gbps: 100
  power:
    base_node_power: 60.0
    source: placeholder
