# Provenance for a5000-llama31-8b-tp1.json
#
# The simulator's cluster-config JSON has nowhere to record where a number came
# from (deviations.md D3 / D7), so every non-obvious value is sourced here.
# Absolute rule 3: nothing below is invented, and nothing unmeasured is labelled
# as measured.

config: experiments/configs/clusters/a5000-llama31-8b-tp1.json
purpose: >
  Sim-vs-real validation of the locally profiled A5000 bundle, mirroring
  bench/examples/configs/Llama-3.1-8B.json so the only intended difference is
  the hardware class.
created: 2026-08-07
upstream_pin: 2c2042ce

fields:
  instances[0].hardware:
    value: A5000
    source: measured
    note: >
      Folder label for profiler/perf/A5000/, produced locally by
      `python -m profiler profile meta-llama/Llama-3.1-8B --hardware A5000
      --tp 1,2`. GPU string reported by the driver is "NVIDIA RTX A5000".

  instances[0].npu_mem.mem_size:
    value: 24
    unit: GB
    source: measured
    note: nvidia-smi reports 24564 MiB total; rounded down to whole GB.

  instances[0].npu_mem.mem_bw:
    value: 768
    unit: GB/s
    source: vendor_spec
    note: >
      NVIDIA published figure for RTX A5000 (384-bit GDDR6). NOT measured on
      this machine — nvidia-smi does not expose achieved bandwidth. Replace with
      a measured value if a bandwidth microbenchmark is ever run.

  instances[0].npu_mem.mem_latency:
    value: 0
    unit: ns
    source: inherited
    note: 0 in every bundled upstream config; kept for comparability.

  cpu_mem, link_bw, link_latency:
    source: inherited
    note: >
      Copied verbatim from bench/examples/configs/Llama-3.1-8B.json so the A5000
      run differs from the RTXPRO6000 reference in hardware only. These are not
      measurements of this host's actual CPU memory or interconnect.

not_recorded_here:
  power:
    status: absent
    note: >
      No `power:` block, so this config produces no energy output. The driver
      reports power.max_limit = 230 W for these cards, but idle_power /
      standby_power / standby_duration have no measured source yet (D7), so the
      block is omitted rather than filled with invented values.
