# ScenarioLab large-scale batch: clusters of 32-128 accelerators (8-16 nodes
# x 4-8 devices), exercising the topology-v2 host model (PCIe root complexes
# of 4, CPU-interconnect bridges, NIC per node, full-mesh inter-node fabric).
#
# Fast path only: full-sim verification of 128-device deployments is a
# multi-hour job - run it deliberately with `python -m scenariolab verify`.
lab:
  batch_name: lab-large
  seed: 20260901

cluster_generator:
  num_clusters: 8
  nodes_per_cluster: {min: 8, max: 16}
  accelerators_per_node: {min: 4, max: 8}
  accelerator_pool:            # measured / vendor_spec only (placeholders rejected)
    - a40                      # measured
    - a5000                    # measured
    - rtxpro6000               # vendor_spec
    - furiosa_rngd_card        # measured (card-as-device)
  same_class_per_node: true
  internode_link_pool: [ib_100g, ib_400g]
  free_ratio: {min: 0.5, max: 1.0}

slo_generator:
  num_specs: 10
  models:
    - meta-llama/Llama-3.1-8B
  arrival_rate_rps: {dist: loguniform, min: 5, max: 200}   # large clusters, large load
  input_tokens_p50: {dist: choice, values: [256, 512, 1024, 4096]}
  output_tokens_p50: {dist: choice, values: [64, 128, 512]}
  ttft_p99_ms: {dist: loguniform, min: 200, max: 5000}
  tpot_p99_ms: {dist: loguniform, min: 30, max: 300}
  power_cap_w: {dist: uniform, min: 2000, max: 40000}
  min_tokens_per_joule: {dist: fixed, value: 0.0}
  objective:
    primary: minimize_energy
    secondary: minimize_active_accelerators

pairing:
  mode: cross                  # 8 x 10 = 80 scenarios
  max_scenarios: 1500

runner:
  workers: 16
  num_requests: 300
  tier_policy:
    envelope_cache: true
    surrogate_top_k: 5
    full_sim: never            # see header - verify deliberately, not by default
  verification:
    fraction: 0.0
    min_count: 0

store:
  db_path: outputs/scenariolab/large/lab.sqlite
  results_dir: outputs/scenariolab/large/results
  clusters_dir: outputs/scenariolab/large/clusters
  services_dir: outputs/scenariolab/large/services
  envelope_dir: outputs/scenariolab/large/envelope
