# ScenarioLab default batch (DESIGN §3.1): 30 clusters x 50 SLOs = 1500
# scenarios on the tiered fast path; full sim only for the verification
# sample (P2 - until then tier_policy.full_sim stays `never`).
lab:
  batch_name: lab-2026-09-01
  seed: 20260901

cluster_generator:
  num_clusters: 30
  nodes_per_cluster: {min: 1, max: 4}
  accelerators_per_node: {min: 1, max: 8}
  accelerator_pool:            # measured / vendor_spec only (placeholders rejected)
    - a40                      # measured
    - a5000                    # measured
    - rtxpro6000               # vendor_spec
    - furiosa_rngd_card        # measured (card-as-device)
  same_class_per_node: true
  internode_link_pool: [ib_100g, ib_400g]
  free_ratio: {min: 0.5, max: 1.0}

slo_generator:
  num_specs: 50
  models:
    - meta-llama/Llama-3.1-8B
  arrival_rate_rps: {dist: loguniform, min: 0.5, max: 30}
  input_tokens_p50: {dist: choice, values: [256, 512, 1024, 4096]}
  output_tokens_p50: {dist: choice, values: [64, 128, 512]}
  ttft_p99_ms: {dist: loguniform, min: 200, max: 5000}
  tpot_p99_ms: {dist: loguniform, min: 30, max: 300}
  power_cap_w: {dist: uniform, min: 400, max: 4000}
  min_tokens_per_joule: {dist: fixed, value: 0.0}
  objective:
    primary: minimize_energy
    secondary: minimize_active_accelerators

pairing:
  mode: cross
  max_scenarios: 1500

runner:
  workers: 16
  num_requests: 300
  tier_policy:
    envelope_cache: true
    surrogate_top_k: 5
    full_sim: verification_only  # needs a node with ASTRA-Sim built
  verification:
    fraction: 0.05
    min_count: 10
    stratify_by: [feasible, cluster_size_bucket, has_npu]
    sim_workers: 32

store:
  db_path: outputs/scenariolab/lab.sqlite
  results_dir: outputs/scenariolab/results
  clusters_dir: outputs/scenariolab/clusters
  services_dir: outputs/scenariolab/services
