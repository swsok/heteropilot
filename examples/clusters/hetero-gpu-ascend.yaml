# Heterogeneous GPU (measured) + Ascend (Tier 0) example — tiered-profiles
# STEP 10, the D4-resolution demonstrator.
#
# PROVENANCE (absolute rule 3): NO hardware in this file physically exists
# here. node0 models an RTX PRO 6000 pair whose perf bundle is the
# upstream-shipped MEASURED one; node1 models an Ascend pair whose bundle is
# SYNTHETIC (tier: analytical, ASCEND_TARGET-t0) — regenerate it with
# scripts/gen-tier0-bundles.sh before planning. Every plan that selects the
# Ascend island carries the simulator-only (analytical inputs) caveat.
# Link numbers are placeholders; none was measured.

cluster_id: hetero-gpu-ascend

nodes:
  - id: node0
    accelerators:
      - id: gpu0
        type: GPU
        vendor: NVIDIA
        model: RTXPRO6000
        backend: cuda
        memory_gb: 96
        state: FREE
        profile: profiles/accelerators/rtxpro6000.yaml
      - id: gpu1
        type: GPU
        vendor: NVIDIA
        model: RTXPRO6000
        backend: cuda
        memory_gb: 96
        state: FREE
        profile: profiles/accelerators/rtxpro6000.yaml
    nics:
      - id: nic0
        type: ethernet
        speed_gbps: 100

  - id: node1
    accelerators:
      - id: npu0
        type: NPU
        vendor: Huawei
        model: ASCEND_TARGET
        backend: ascend
        memory_gb: 64
        state: FREE
        profile: profiles/accelerators/ascend_target.yaml
      - id: npu1
        type: NPU
        vendor: Huawei
        model: ASCEND_TARGET
        backend: ascend
        memory_gb: 64
        state: FREE
        profile: profiles/accelerators/ascend_target.yaml
    nics:
      - id: nic0
        type: ethernet
        speed_gbps: 100

links:
  - id: pcie-node0-gpu0-gpu1
    src: node0/gpu0
    dst: node0/gpu1
    type: PCIE
    bandwidth_gbps: 128
    latency_ns: 1200
    contention_group: node0-pcie-root
    source: placeholder

  - id: hccs-node1-npu0-npu1
    src: node1/npu0
    dst: node1/npu1
    type: HCCS
    bandwidth_gbps: 392
    latency_ns: 1200
    contention_group: node1-hccs
    source: placeholder

  - id: eth-node0-node1
    src: node0/nic0
    dst: node1/nic0
    type: ETHERNET
    bandwidth_gbps: 100
    latency_ns: 5000
    source: placeholder
