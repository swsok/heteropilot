# Reference ServiceSpec from the work order §3.1.
#
# The traffic figures are an illustrative workload, not a measured production
# trace. Qwen3-32B in bfloat16 needs ~64 GB of weights, so this spec cannot be
# served on the 24 GB cards in this lab - it is a planning target that exercises
# the larger islands.

service:
  model: Qwen/Qwen3-32B
  dtype: bfloat16
  kv_cache_dtype: auto

traffic:
  arrival_rate_rps: 15
  input_tokens:
    p50: 512
    p95: 4096
    p99: 8192
  output_tokens:
    p50: 128
    p95: 512
  burstiness: 2.0
  prefix_share_ratio: 0.20

slo:
  ttft:
    percentile: 99
    max_ms: 500
  tpot:
    percentile: 99
    max_ms: 40
  max_cluster_power_w: 3000
  min_tokens_per_joule: 0.40

objective:
  primary: maximize_slo_goodput_per_joule
  secondary: minimize_active_accelerators
